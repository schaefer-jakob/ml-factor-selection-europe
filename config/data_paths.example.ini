; Copy this file to config/data_paths.ini (not tracked by git) to read the
; input files from other locations or under other names. Every key is
; optional; missing keys keep the default layout below data/ (or BA_DATA_DIR).
; Relative patterns are resolved against the data directory, absolute ones
; are used as they are. Placeholders: {cty} lower-case and {CTY} upper-case
; ISO code, {char} JKP characteristic, {weight} vw_cap or ew, {series} FRED id.

[data]
; data_dir = D:/research/jkp-data

[paths]
; jkp_factors = jkp/[{cty}]_[all_factors]_[monthly]_[vw_cap].zip
; jkp_market = jkp/[{cty}]_[mkt]_[monthly]_[vw_cap].zip
; jkp_portfolios = jkp/portfolios/[{cty}]_[{char}]_[monthly]_[{weight}].zip
; french_ff5 = french/Europe_5_Factors_CSV.zip
; french_mom = french/Europe_Mom_Factor_CSV.zip
; fred = fred/{series}.csv
; compustat_fx = compustat/g_exrt_dly.csv.gz
